[package]
name = "pangea-fastbridge"
version = "0.1.0"
edition = "2021"
description = "Pangea's shared fast-bridge order book on Solana: one program for every Pangea token"

[lib]
crate-type = ["cdylib", "lib"]
name = "pangea_fastbridge"

# no-idl ON BY DEFAULT, for the same reason as pangea-splitter: Anchor's IDL instructions are
# permissionless account writers this program should not carry.
[features]
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
# REHEARSAL ONLY: ADMIN is the key named at build time by PANGEA_REHEARSAL_ADMIN (src/rehearsal_admin.rs),
# a throwaway key generated on the test server, so a rehearsal never needs the real admin key. Never in a
# default build (byte-identical without it: rehearsal/v3c/default-hash.sh); never deployed to a cluster.
rehearsal-admin = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { version = "0.30.1", features = ["init-if-needed"] }
anchor-spl = "0.30.1"

[dev-dependencies]
litesvm = "=0.1.0"
solana-sdk = "~1.18"
solana-program-runtime = "~1.18"
libsecp256k1 = "=0.6.0"
serde_json = "1"
bincode = "1.3"
pangea-splitter = { path = "../pangea-splitter", features = ["no-entrypoint"] }
