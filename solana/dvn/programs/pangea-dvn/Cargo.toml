[package]
name = "pangea-dvn"
version = "0.1.0"
edition = "2021"
description = "Pangea's LayerZero V2 verifier (DVN) on Solana"

[lib]
crate-type = ["cdylib", "lib"]
name = "pangea_dvn"

# `no-idl` on by default, as in pangea-splitter: without it Anchor compiles in its own permissionless
# IDL-account instructions, which a program that will be made final should not carry.
[features]
default = ["no-idl"]
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"

# The same test stack as pangea-splitter (see memory: litesvm 0.1.0 + solana-sdk 1.18 is what runs
# on Windows). libsecp256k1 signs the attestations the way the off-chain service does.
[dev-dependencies]
litesvm = "=0.1.0"
solana-sdk = "~1.18"
libsecp256k1 = "0.6"
sha2 = "0.10"
