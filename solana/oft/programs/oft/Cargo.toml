[package]
name = "oft"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "oft"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
# stocks-d (v3.1, owner D3): gap route hops on Raydium CLMM (kind 2) and Orca Whirlpool (kind 3);
# off by default, the default build stays the v3 release (docs/stocks-solana-gap-hop.md).
stock-hops = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build", "oapp/idl-build"]

[dependencies]
anchor-lang = { version = "0.31.1", features = ["init-if-needed"] }
anchor-spl = "0.31.1"
oapp = { package = "oapp-latest", git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "c09287a" }
utils = { package = "utils-latest", git = "https://github.com/LayerZero-Labs/LayerZero-v2.git", rev = "c09287a" }
solana-helper = "0.1.0"
[dev-dependencies]
# To read test/fixtures/gap-vectors.json (src/gap/math.rs tests).
serde_json = "1"
